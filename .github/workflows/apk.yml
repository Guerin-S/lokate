name: Build LOKATE APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: '${{ runner.tool_cache }}/android/sdk'
      FLUTTER_ROOT: '${{ runner.tool_cache }}/flutter'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Accept licenses
        run: yes | flutter doctor --android-licenses

      - name: Set up Android
        run: |
          chmod +x ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager
          ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" --install "build-tools;33.0.2"

      - name: Get dependencies
        run: flutter pub get --verbose

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lokate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build info
        run: |
          echo "✅ APK générée avec succès !"
          ls -lh build/app/outputs/flutter-apk/app-release.apk